name: Refresh city events

# Everything else on the site reads live sources on each request. City events
# are the exception: cupertino.gov's CDN refuses requests from hosting
# providers, so the deploy host cannot fetch them and a capture is committed
# instead. This keeps that capture current.
#
# GitHub runners can reach the site, confirmed by the runs on Aug 28 and 29.
# If that ever stops being true the capture step fails loudly rather than
# writing a stale file, and `npm run snapshot:events` from an ordinary
# connection is the fallback.

on:
  schedule:
    - cron: "17 13 * * *" # 06:17 Pacific daily, before most people look
  workflow_dispatch: {}

permissions:
  contents: write

# The scheduler occasionally fires a cron twice. Without this, both runs race
# to push and the loser fails on a non-fast-forward.
concurrency:
  group: refresh-events
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Read at the job level so the deploy step's `if` can see it. A step's own
      # `env` block is not in scope for that step's condition.
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture events
        run: npm run snapshot:events

      - name: Commit if the capture changed
        id: commit
        run: |
          if git diff --quiet -- src/data/events-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in the city's listings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events-snapshot.json
          git commit -m "Refresh city events capture"
          # Someone else may have landed a commit since checkout. Rebase onto
          # whatever is there and try again rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase origin main
          done
          echo "Could not push after three attempts."
          exit 1

      # Deploys are not wired to Git, so a commit alone does not reach the site.
      # Skipped automatically when the hook secret is absent.
      - name: Trigger a deploy
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" -o /dev/null && echo "Deploy triggered."
